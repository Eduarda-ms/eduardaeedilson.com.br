name: Diagnosticar certificado do dominio
on:
  push:
    paths:
      - '.github/workflows/ativar-https.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar DNS e certificado sem alterar o site
        run: |
          for tipo in A AAAA CAA NS; do
            echo "=== DNS ${tipo} ==="
            dig +time=3 +tries=1 +short eduardaeedilson.com.br "${tipo}" || true
          done
          echo "=== WWW CNAME ==="
          dig +time=3 +tries=1 +short www.eduardaeedilson.com.br CNAME || true
          echo "=== HEADERS HTTPS / CERT STATUS ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://eduardaeedilson.com.br/ 2>&1 | tail -45 || true
          echo "=== CERTIFICATE SUBJECT ==="
          timeout 15 bash -c 'echo | openssl s_client -connect eduardaeedilson.com.br:443 -servername eduardaeedilson.com.br 2>/dev/null | openssl x509 -noout -subject -issuer -dates' || true
