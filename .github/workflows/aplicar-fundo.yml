name: Aplicar fundo identidade visual

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aplicar-fundo.yml'

permissions:
  contents: write

jobs:
  aplicar-fundo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar CSS final do fundo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          bloco = '''
          <style>
          /* ===== FUNDO FINAL - IDENTIDADE VISUAL ===== */
          html,
          body,
          body.site-identidade {
            background-color:#f8eee8 !important;
            background-image:url("./identidade-visual.webp") !important;
            background-repeat:repeat-y !important;
            background-position:center top !important;
            background-size:100% auto !important;
            background-attachment:scroll !important;
          }

          /* Capa permanece somente com o vídeo */
          body.site-identidade .hero {
            background:none !important;
            background-image:none !important;
          }

          /* A arte aparece claramente em TODAS as seções abaixo da capa */
          body.site-identidade section:not(.hero),
          body.site-identidade .papel-section,
          body.site-identidade .historia,
          body.site-identidade .grande-dia,
          body.site-identidade .presentes,
          body.site-identidade .lista-presentes,
          body.site-identidade .informacoes,
          body.site-identidade .rsvp,
          body.site-identidade .galeria,
          body.site-identidade .final,
          body.site-identidade .countdown-section {
            background-color:#f8eee8 !important;
            background-image:url("./identidade-visual.webp") !important;
            background-repeat:repeat-y !important;
            background-position:center top !important;
            background-size:100% auto !important;
          }

          /* Caixas claras, mas com transparência suficiente para a identidade aparecer */
          body.site-identidade .convite-box,
          body.site-identidade .ornamental-card,
          body.site-identidade .card,
          body.site-identidade .presente-card,
          body.site-identidade .countdown-inner {
            background:rgba(255,249,245,.84) !important;
            backdrop-filter:none !important;
            -webkit-backdrop-filter:none !important;
          }

          @media (max-width:650px) {
            html,
            body,
            body.site-identidade,
            body.site-identidade section:not(.hero),
            body.site-identidade .countdown-section,
            body.site-identidade .final {
              background-size:100% auto !important;
            }
          }
          </style>
          <!-- ===== FIM FUNDO FINAL - IDENTIDADE VISUAL ===== -->
          '''

          bloco = '\n'.join(line[10:] if line.startswith('          ') else line for line in bloco.splitlines()) + '\n'
          padrao = re.compile(r'<style>\s*/\* ===== FUNDO FINAL - IDENTIDADE VISUAL ===== \*/.*?<!-- ===== FIM FUNDO FINAL - IDENTIDADE VISUAL ===== -->\s*', re.S)
          if padrao.search(text):
              text = padrao.sub(bloco + '\n', text)
          else:
              text = text.replace('</head>', bloco + '\n</head>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deixa identidade visual visível no fundo"
          git push
